name: build apk

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 即发版，如 v6.6.9
  workflow_dispatch: # 手动构建：只出 artifact，不发 Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 设置变量
      - name: Set output
        id: vars
        run: |
          echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: 下载源码
        id: check
        uses: actions/checkout@v4

      - name: 初始化 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 初始化 Android SDK
        uses: android-actions/setup-android@v3

      - name: 初始化 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 打包模版 APP
        run: |
          chmod +x ./gradlew
          ./gradlew app:buildTemplateApp

      - name: 打包 Auto.js App
        run: |
          ./gradlew app:assembleV6

      - name: 对 APP 进行签名
        uses: Tlaster/android-sign@v1.2.2
        with:
          releaseDirectory: |
            app/build/outputs/apk/v6/release
          signingKeyBase64: ${{ secrets.ASIGNING_KEY }}
          alias: ${{ secrets.AALIAS }}
          keyStorePassword: ${{ secrets.AKEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.AKEY_PASSWORD }}
          output: build/app/signed
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: 重命名 apk
        run: |
          cd build/app/signed
          mv app-v6-arm64-v8a-*.apk Autox-v6-arm64-v8a-release-${{steps.vars.outputs.short_ref}}.apk
          mv app-v6-armeabi-v7a-*.apk Autox-v6-armeabi-v7a-release-${{steps.vars.outputs.short_ref}}.apk
          mv app-v6-universal-*.apk Autox-v6-universal-release-${{steps.vars.outputs.short_ref}}.apk
          ls

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Autox-v6-release-${{steps.vars.outputs.short_ref}}
          path: build/app/signed/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{steps.vars.outputs.short_ref}}
          body: |
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{steps.vars.outputs.short_ref}}/CHANGELOG.md)
          # 匹配目录下所有文件
          files: 'build/app/signed/**'
          draft: true  # 草稿
